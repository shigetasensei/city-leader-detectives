<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenge Quiz: Think Like a Detective</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#fef6e4,#e0f4ff);margin:0;color:#1d2433;font-size:1.15rem;line-height:1.9}
main{max-width:720px;margin:0 auto;padding:20px}
h1{font-size:2rem;margin:.3em 0;color:#1d4ed8}
h2{font-size:1.5rem;margin:0 0 8px;color:#102a43}
.card{background:#fff;border-radius:18px;padding:18px 22px;margin:14px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
ul{padding-left:1.3em;margin:.4em 0}
li{margin:.4em 0}
mark{background:#fff3a3;padding:0 4px;border-radius:5px;font-weight:700;color:#102a43}
.btn{display:inline-block;padding:12px 18px;border-radius:14px;text-decoration:none;font-weight:700;margin:6px 8px 6px 0;color:#1d2433;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.b1{background:#ffb703}.b3{background:#8ecae6}
.muted{color:#4a5568;font-size:1rem}
.g button{font:inherit;font-weight:700;border:2px solid #8ecae6;border-radius:999px;background:#fff;padding:2px 10px;margin:0 3px;cursor:pointer}
.fb{display:block;font-weight:700;min-height:1.4em}
.tool{font:inherit;font-weight:700;border:2px solid #cbd5e1;border-radius:12px;background:#fff;padding:6px 10px;cursor:pointer}
.tool.on,.sz.on{border-color:#1d4ed8;background:#dbeafe}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #94a3b8;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px #102a43}
.g{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.g button{margin:0}
.fb{min-height:0;margin-top:6px}
.fb:empty{display:none}
body{background-attachment:fixed;min-height:100vh}
#ideas{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}

.lv{border-radius:18px;padding:14px 18px;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.08);border:3px solid}
.arrow{text-align:center;font-size:1.6rem;line-height:1;margin:4px 0;color:#64748b}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>div{flex:1 1 220px;border-radius:14px;padding:10px 14px;border:2px solid}
.row>div.l3{border-color:#74c69d}

.l1{background:#fde2e4;border-color:#f4a6b0}.l2{background:#fff1c9;border-color:#f2c14e}
.l3{background:#d8f3dc;border-color:#74c69d}.l4{background:#dbeafe;border-color:#7fb3f0}
.big2{font-size:1.35rem;font-weight:800;margin:0}

.stage{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 16px rgba(0,0,0,.1);text-align:center}
.hud{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}
.card-now{display:inline-block;min-width:200px;font-size:1.8rem;font-weight:900;padding:14px 22px;border-radius:20px;background:#fff3a3;border:4px solid #f2c14e;box-shadow:0 6px 0 rgba(0,0,0,.12);margin:8px 0}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bk{font:inherit;font-weight:800;font-size:1.15rem;padding:16px 8px;border-radius:18px;border:3px solid;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bk small{display:block;font-weight:600;font-size:.85rem;color:#475569}

.opt{display:block;width:100%;font:inherit;font-weight:800;font-size:1.15rem;padding:14px;margin:8px 0;border-radius:16px;border:3px solid #cbd5e1;background:#fff;cursor:pointer}

.fly{position:fixed;font-size:2rem;pointer-events:none;animation:fl 1.1s ease-out forwards}
@keyframes fl{to{transform:translate(var(--x),-160px) rotate(var(--r));opacity:0}}
.big{font-size:3.5rem;margin:.1em 0}

</style>
<script src="accessibility.js"></script>
</head>
<body>
<main>
<a class="btn b3" href="index.html">🗺️ Back to the main page</a>
<h1>🧠 Challenge Quiz</h1>
<div class="stage" id="stage"></div>
<p class="muted" style="margin-top:14px">Need help? Read <a href="kobe-government.html">How Kobe decides</a> and <a href="hyogo-structure.html">Who is who in Hyogo</a>. Made with Claude AI. Please check the facts.</p>
</main>
<script>
const Q={
1:[
 ['Who leads Kobe City?',['The Mayor','The Governor','A Ward Mayor'],0,'The mayor leads the city.'],
 ['Kobe has how many wards?',['9','3','20'],0,'Kobe has 9 wards.'],
 ['Who is elected by citizens?',['The mayor and assembly members','Only the teacher','Only the Governor'],0,'Citizens vote for the mayor and for assembly members.'],
 ['What does the City Assembly do?',['Talks about and decides rules and the budget','Drives the city bus','Teaches at school'],0,'It decides rules (ordinances) and how the city spends money.'],
 ['Which is a good way to check a fact online?',['Look at an official website','Believe the first picture','Ask nobody'],0,'Official sites are written by the people in charge.']],
2:[
 ['How long is a mayor\u2019s term?',['4 years','2 years','10 years'],0,'Mayors and assembly members serve for 4 years, then there is an election.'],
 ['In Kobe the City Assembly is called 市会 (shikai). In many cities it is called 市議会. Are they the same kind of group?',['Yes, same job, different name','No, one is for kids','No, one is a company'],0,'Both are the city\u2019s group of elected members who decide rules and the budget.'],
 ['Who carries out the plan after the assembly decides?',['The mayor and city staff','The students','The Governor only'],0,'The mayor runs the city. The assembly decides and checks.'],
 ['An AI summary says something about the mayor. What should you do?',['Check the mayor\u2019s official page','Copy it right away','Believe it because it sounds smart'],0,'AI can make mistakes. Check with a source made by the person or city.'],
 ['Which is the best source for what the mayor said?',['The mayor\u2019s own site or video','A random comment','A guess from a friend'],0,'The closest source to the speaker is the best.'],
 ['Why does Kobe have 9 ward offices?',['To help people close to their homes','To make the city smaller','Because the Governor asked'],0,'Ward offices handle local needs like papers and moving.']],
3:[
 ['The City Assembly has 65 members. What is the smallest number of votes that is more than half?',['33','32','35'],0,'Half of 65 is 32.5, so 33 is the smallest majority.'],
 ['A mayor wins an election in 2025 and serves 4 years. In which year is the next mayor election?',['2029','2028','2030'],0,'2025 + 4 = 2029.'],
 ['Your AI helper gives a number but no source. Which is the best next step?',['Find the number on an official page and compare','Use it, AI is always right','Ask the same AI again and trust it'],0,'Compare with an official source. Asking the same AI again is not a check.'],
 ['Mayor and assembly are both elected by citizens. What does that mean?',['They are equal partners who check each other','The mayor is the boss of the assembly','The assembly is the boss of the mayor'],0,'Because both are elected, they work as equal partners.'],
 ['Which statement is an OPINION, not a fact?',['Kobe is the most beautiful city in Japan','Kobe has 9 wards','Kobe is the capital of Hyogo'],0,'\u201cMost beautiful\u201d depends on the person. Facts can be checked.'],
 ['Two websites give different numbers for the same thing. What is a smart move?',['Check which one is official and newer','Pick the bigger number','Pick the one with more pictures'],0,'Look at who made it and when. Official and newer is usually better.'],
 ['A news site says \u201cMayor Ishii said X\u201d. How can you be a detective?',['Find the mayor\u2019s own words or video to match','Trust it because it has a photo','Trust it because it is long'],0,'Match the claim to the original source.']]
};
const NAMES={1:['⭐','Easy'],2:['⭐⭐','Normal'],3:['⭐⭐⭐','Challenging']};
const st=document.getElementById('stage');
let lv=1,i=0,score=0,deck=[];
const SK='cld-challenge-quiz';
function sv(){try{localStorage.setItem(SK,JSON.stringify({lv:lv,i:i,score:score}))}catch(e){}}
function ld(){try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}}
function clr(){try{localStorage.removeItem(SK)}catch(e){}}
function pause(){sv();st.innerHTML='<div class="big">⏸️</div><h2>Paused and saved!</h2><p>Open this page again in the <b>same browser</b> and tap <b>Continue</b> to keep going.</p><button class="bk b-c" style="width:100%" onclick="menu()">OK</button>';}
function resume(){const d=ld();if(!d)return menu();lv=d.lv;i=d.i;score=d.score;deck=Q[lv].slice();show();}
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function burst(n,em){for(let k=0;k<n;k++){const e=document.createElement('div');e.className='fly';e.textContent=em[k%em.length];e.style.left=(30+Math.random()*40)+'vw';e.style.top='55vh';e.style.setProperty('--x',(Math.random()*160-80)+'px');e.style.setProperty('--r',(Math.random()*60-30)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1200);}}
function menu(){
 const sd=ld();
 st.innerHTML=(sd?`<button class="bk b-w" style="width:100%;margin-bottom:12px" onclick="resume()">▶️ Continue my quiz<small>${NAMES[sd.lv][0]} ${NAMES[sd.lv][1]}: question ${sd.i+1}, saved on this device</small></button>`:'')+`<div class="big">🧠</div><h2>Pick a level</h2><p>Questions about how cities work and how to check information online.</p>
 <button class="bk b-c" style="width:100%;margin-bottom:8px" onclick="go(1)">⭐ Easy<small>Warm up</small></button>
 <button class="bk b-p" style="width:100%;margin-bottom:8px" onclick="go(2)">⭐⭐ Normal<small>Think a little harder</small></button>
 <button class="bk b-t" style="width:100%" onclick="go(3)">⭐⭐⭐ Challenging<small>Math, opinions vs facts, and checking AI</small></button>`;
}
function go(l){lv=l;i=0;score=0;deck=Q[l].slice();show();}
function show(){
 if(i>=deck.length)return end();
 const q=deck[i];sv();
 const opts=shuffle(q[1].map((t,n)=>[t,n===q[2]]));
 st.innerHTML=`<div class="hud"><span>${NAMES[lv][0]} ${NAMES[lv][1]} ${i+1}/${deck.length}</span><span>⭐ ${score}</span><button class="pz" onclick="pause()">⏸️ Pause</button></div><h2 style="margin:.3em 0">${q[0]}</h2><div id="opts"></div><div class="msg" id="msg" aria-live="polite"></div><div id="nx"></div>`;
 const box=document.getElementById('opts');let tried=false;
 opts.forEach(([t,good])=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{
  const m=document.getElementById('msg');
  if(good){if(!tried)score++;m.style.color='#15803d';m.textContent='✅ '+q[3];burst(5,['⭐','✨']);
   box.querySelectorAll('button').forEach(x=>x.disabled=true);
   document.getElementById('nx').innerHTML='<button class="bk b-c" style="width:100%" onclick="i++;show()">Next ▶️</button>';}
  else{tried=true;m.style.color='#b45309';m.textContent='❌ Not quite. Try another one!';b.classList.add('shake');b.disabled=true;}
 };box.appendChild(b);});
}
function end(){clr();
 const n=deck.length,pct=score/n;
 const badge=pct>=0.85?'🏆 Master Detective':pct>=0.6?'🥈 Super Detective':'🥉 Rookie Detective';
 st.innerHTML=`<div class="big">🏅</div><h2>${NAMES[lv][0]} ${NAMES[lv][1]}: ${badge}</h2><p style="font-size:1.3rem">${score} / ${n} right on the first try</p>`+
 (lv<3?`<button class="bk b-p" style="width:100%;margin-bottom:8px" onclick="go(${lv+1})">⬆️ Try ${NAMES[lv+1][1]}</button>`:'')+
 `<button class="bk b-c" style="width:100%" onclick="menu()">🔁 Choose a level</button>`;
 burst(14,['🎉','⭐','🎊','✨']);
}
menu();
</script>
</body>
</html>
