<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Detective Island: Explore, Play, Earn Your Badge</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#fef6e4,#e0f4ff);margin:0;color:#1d2433;font-size:1.15rem;line-height:1.9}
main{max-width:720px;margin:0 auto;padding:20px}
h1{font-size:2rem;margin:.3em 0;color:#1d4ed8}
h2{font-size:1.5rem;margin:0 0 8px;color:#102a43}
.card{background:#fff;border-radius:18px;padding:18px 22px;margin:14px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
ul{padding-left:1.3em;margin:.4em 0}
li{margin:.4em 0}
mark{background:#fff3a3;padding:0 4px;border-radius:5px;font-weight:700;color:#102a43}
.btn{display:inline-block;padding:12px 18px;border-radius:14px;text-decoration:none;font-weight:700;margin:6px 8px 6px 0;color:#1d2433;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.b1{background:#ffb703}.b3{background:#8ecae6}
.muted{color:#4a5568;font-size:1rem}
.g button{font:inherit;font-weight:700;border:2px solid #8ecae6;border-radius:999px;background:#fff;padding:2px 10px;margin:0 3px;cursor:pointer}
.fb{display:block;font-weight:700;min-height:1.4em}
.tool{font:inherit;font-weight:700;border:2px solid #cbd5e1;border-radius:12px;background:#fff;padding:6px 10px;cursor:pointer}
.tool.on,.sz.on{border-color:#1d4ed8;background:#dbeafe}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #94a3b8;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px #102a43}
.g{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.g button{margin:0}
.fb{min-height:0;margin-top:6px}
.fb:empty{display:none}
body{background-attachment:fixed;min-height:100vh}
#ideas{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
#ideas button{margin:0!important}
.lv{border-radius:18px;padding:14px 18px;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.08);border:3px solid}
.arrow{text-align:center;font-size:1.6rem;line-height:1;margin:4px 0;color:#64748b}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>div{flex:1 1 220px;border-radius:14px;padding:10px 14px;border:2px solid}
.row>div.l3{border-color:#74c69d}
.arrow{font-size:1.1rem!important;margin:8px 0!important}
.l1{background:#fde2e4;border-color:#f4a6b0}.l2{background:#fff1c9;border-color:#f2c14e}
.l3{background:#d8f3dc;border-color:#74c69d}.l4{background:#dbeafe;border-color:#7fb3f0}
.big2{font-size:1.35rem;font-weight:800;margin:0}
.ja{color:#475569;font-weight:700}
.q2{list-style:none;padding:10px 14px;margin:10px 0;background:#fff8d6;border-radius:14px}
.g{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.g button{margin:0}
.fb{min-height:0;margin-top:6px}.fb:empty{display:none}
body{background-attachment:fixed;min-height:100vh}
.stage{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 16px rgba(0,0,0,.1);text-align:center}
.hud{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}
.card-now{display:inline-block;min-width:200px;font-size:1.8rem;font-weight:900;padding:14px 22px;border-radius:20px;background:#fff3a3;border:4px solid #f2c14e;box-shadow:0 6px 0 rgba(0,0,0,.12);margin:8px 0}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bk{font:inherit;font-weight:800;font-size:1.15rem;padding:16px 8px;border-radius:18px;border:3px solid;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bk small{display:block;font-weight:600;font-size:.85rem;color:#475569}
.bk:active{transform:translateY(3px);box-shadow:none}
.b-p{background:#fff1c9;border-color:#f2c14e}.b-c{background:#d8f3dc;border-color:#74c69d}
.b-t{background:#ffe3d3;border-color:#f4a77a}.b-w{background:#dbeafe;border-color:#7fb3f0}
.opt{display:block;width:100%;font:inherit;font-weight:800;font-size:1.15rem;padding:14px;margin:8px 0;border-radius:16px;border:3px solid #cbd5e1;background:#fff;cursor:pointer}
.msg{min-height:2.2em;font-weight:800;margin:8px 0}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .4s}@keyframes pp{50%{transform:scale(1.2)}}
.fly{position:fixed;font-size:2rem;pointer-events:none;animation:fl 1.1s ease-out forwards}
@keyframes fl{to{transform:translate(var(--x),-160px) rotate(var(--r));opacity:0}}
.big{font-size:3.5rem;margin:.1em 0}
.pz{font:inherit;font-weight:800;font-size:.9rem;border:2px solid #94a3b8;background:#fff;border-radius:999px;padding:2px 12px;cursor:pointer;margin-left:6px}

.isl{cursor:pointer}.isl:focus-visible ellipse{stroke:#f59e0b;stroke-width:5}
.mis{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0;padding:10px;border-radius:16px;background:#fff;border:2px solid #e2e8f0;color:#1d2433}
.mis a{font-weight:800}.mis .tk{margin-left:auto;font:inherit;font-weight:800;border:2px solid #94a3b8;background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;color:#1d2433}
.mis .tk.on{background:#bbf7d0;border-color:#22c55e}
.cert{border:6px double #f59e0b;border-radius:20px;padding:18px;background:#fffbeb;color:#1d2433;text-align:center;margin-top:14px}
.cert *{color:#1d2433}
.cert input{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid #94a3b8;max-width:100%;text-align:center}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%}}
</style>
<script src="accessibility.js"></script>
</head>
<body>
<main>
<a class="btn b3" href="index.html">🗺️ Back to the main page</a>
<h1>🏝️ Detective Island</h1>
<p>Visit all four lands. Finish the missions in each land to earn a ⭐. Get all 4 stars to earn your Detective Badge!</p>
<div class="stage" style="text-align:center;padding:10px">
<svg id="map" viewBox="0 0 400 320" style="width:100%;max-width:520px;border-radius:18px;background:linear-gradient(#bfe9ff,#e6f7ff)" role="group" aria-label="Map of Detective Island"></svg>
<div class="hud" style="justify-content:center"><span id="tot"></span><button class="pz" onclick="resetAll()">↩️ Start over</button></div>
</div>
<div class="stage" id="panel" style="margin-top:12px"></div>
<div id="certbox"></div>
<p class="muted" style="margin-top:14px">Your stars are saved only in this browser. Nothing is sent to anyone. Made with Claude AI. Please check the facts.</p>
</main>
<script>
const LANDS=[
 {id:'forest',em:'🌲',name:'Fact Forest',tip:'Think carefully about what you read online.',x:95,y:90,c:'#bbf7d0',
  m:[{id:'cq',t:'Think & Check Quiz',u:'challenge-quiz.html',auto:'cq'},{id:'aq',t:'Ashiya Quote Detectives',u:'ashiya-quote.html'},{id:'nq',t:'Nishinomiya Quote Detectives',u:'nishinomiya-quote.html'},{id:'l1',t:'Real Quote or AI Summary?',u:'lesson1-game.html'}]},
 {id:'mountain',em:'🏔️',name:'Map Mountain',tip:'Know your places: prefecture, city, town, ward.',x:300,y:80,c:'#fde68a',
  m:[{id:'hg',t:'Sort & Lead Game',u:'hyogo-game.html',auto:'hg'},{id:'hs',t:'Who is who in Hyogo? (chart and map)',u:'hyogo-structure.html'}]},
 {id:'harbor',em:'⚓',name:'Assembly Harbor',tip:'Learn how a city makes decisions.',x:105,y:235,c:'#bae6fd',
  m:[{id:'kg',t:'How Kobe Decides',u:'kobe-government.html'},{id:'kb',t:'Kobe City page',u:'kobe.html'}]},
 {id:'lab',em:'🤖',name:'AI Lab Island',tip:'Notice where AI is helping you.',x:300,y:235,c:'#e9d5ff',
  m:[{id:'pa',t:'Person or AI? Can you tell?',u:'human-ai.html'},{id:'st',t:'Stop & Think: how did AI help you? (find it on the bottom of the Ashiya page)',u:'ashiya.html'}]}
];
const K='cld-island';
function load(){try{return JSON.parse(localStorage.getItem(K)||'{}')}catch(e){return {}}}
function save(P){try{localStorage.setItem(K,JSON.stringify(P))}catch(e){}}
let sel=0;
function isDone(P,m){return !!((P.done||{})[m.id]||(m.auto&&(P.auto||{})[m.auto]))}
function landDone(P,l){return l.m.every(m=>isDone(P,m))}
function draw(){
 const P=load();const svg=document.getElementById('map');
 let h='<path d="M95 90 Q200 20 300 80 M300 80 Q330 160 300 235 M300 235 Q200 290 105 235 M105 235 Q60 160 95 90" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>';
 LANDS.forEach((l,i)=>{const d=landDone(P,l);
  h+=`<g class="isl" tabindex="0" role="button" aria-label="${l.name}${d?', done':''}" onclick="pick(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){pick(${i});event.preventDefault()}"><ellipse cx="${l.x}" cy="${l.y}" rx="66" ry="46" fill="${l.c}" stroke="${i===sel?'#f59e0b':'#fff'}" stroke-width="${i===sel?5:3}"/><text x="${l.x}" y="${l.y+4}" text-anchor="middle" font-size="34">${l.em}</text><text x="${l.x}" y="${l.y+30}" text-anchor="middle" font-size="12" font-weight="800" fill="#1d2433">${l.name}</text><text x="${l.x+46}" y="${l.y-28}" font-size="26">${d?'⭐':'☆'}</text></g>`;});
 svg.innerHTML=h;
 const n=LANDS.filter(l=>landDone(P,l)).length;
 document.getElementById('tot').textContent='⭐ '+n+' / 4 lands';
 panel(P);cert(P,n);
}
function pick(i){sel=i;draw()}
function panel(P){
 const l=LANDS[sel];let h=`<h2 style="margin:.2em 0">${l.em} ${l.name}</h2><p>${l.tip}</p>`;
 l.m.forEach(m=>{const on=isDone(P,m);
  h+=`<div class="mis"><a href="${m.u}">${m.t} ▶️</a>${m.auto?`<span>${on?'✅ finished':'(finish a level to get ✅)'}</span>`:`<button class="tk ${on?'on':''}" onclick="tick('${m.id}')" aria-pressed="${on}">${on?'✅ Done':'☐ I did it!'}</button>`}</div>`;});
 document.getElementById('panel').innerHTML=h;
}
function tick(id){const P=load();P.done=P.done||{};P.done[id]=!P.done[id];save(P);draw()}
function cert(P,n){
 const b=document.getElementById('certbox');
 if(n<4){b.innerHTML='';return}
 b.innerHTML=`<div class="cert"><div style="font-size:3rem">🏅</div><h2>Detective Badge</h2><p>Type your first name or a nickname:</p><p><input id="nm" maxlength="20" value="${(P.name||'').replace(/"/g,'')}" oninput="nm(this.value)" aria-label="Your name or nickname"></p><p style="font-size:1.2rem"><b id="nmo">${(P.name||'Super Detective').replace(/</g,'')}</b> visited all four lands of Detective Island!</p><p>I can check facts, know my places, understand how cities decide, and notice how AI helps me.</p><button class="bk b-c" onclick="window.print()">🖨️ Print my badge</button></div>`;
}
function nm(v){const P=load();P.name=v;save(P);document.getElementById('nmo').textContent=v.replace(/</g,'')||'Super Detective'}
function resetAll(){if(confirm('Clear all your stars on this device?')){try{localStorage.removeItem(K)}catch(e){}draw()}}
draw();
</script>
</body>
</html>
