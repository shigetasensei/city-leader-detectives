<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Is Who in Hyogo: Game</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,#fef6e4,#e0f4ff);margin:0;color:#1d2433;font-size:1.15rem;line-height:1.9}
main{max-width:720px;margin:0 auto;padding:20px}
h1{font-size:2rem;margin:.3em 0;color:#1d4ed8}
h2{font-size:1.5rem;margin:0 0 8px;color:#102a43}
.card{background:#fff;border-radius:18px;padding:18px 22px;margin:14px 0;box-shadow:0 4px 12px rgba(0,0,0,.08)}
ul{padding-left:1.3em;margin:.4em 0}
li{margin:.4em 0}
mark{background:#fff3a3;padding:0 4px;border-radius:5px;font-weight:700;color:#102a43}
.btn{display:inline-block;padding:12px 18px;border-radius:14px;text-decoration:none;font-weight:700;margin:6px 8px 6px 0;color:#1d2433;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.b1{background:#ffb703}.b3{background:#8ecae6}
.muted{color:#4a5568;font-size:1rem}
.g button{font:inherit;font-weight:700;border:2px solid #8ecae6;border-radius:999px;background:#fff;padding:2px 10px;margin:0 3px;cursor:pointer}
.fb{display:block;font-weight:700;min-height:1.4em}
.tool{font:inherit;font-weight:700;border:2px solid #cbd5e1;border-radius:12px;background:#fff;padding:6px 10px;cursor:pointer}
.tool.on,.sz.on{border-color:#1d4ed8;background:#dbeafe}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #94a3b8;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px #102a43}
.g{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.g button{margin:0}
.fb{min-height:0;margin-top:6px}
.fb:empty{display:none}
body{background-attachment:fixed;min-height:100vh}
#ideas{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
#ideas button{margin:0!important}
.lv{border-radius:18px;padding:14px 18px;margin:0 auto;box-shadow:0 4px 12px rgba(0,0,0,.08);border:3px solid}
.arrow{text-align:center;font-size:1.6rem;line-height:1;margin:4px 0;color:#64748b}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>div{flex:1 1 220px;border-radius:14px;padding:10px 14px;border:2px solid}
.row>div.l3{border-color:#74c69d}
.arrow{font-size:1.1rem!important;margin:8px 0!important}
.l1{background:#fde2e4;border-color:#f4a6b0}.l2{background:#fff1c9;border-color:#f2c14e}
.l3{background:#d8f3dc;border-color:#74c69d}.l4{background:#dbeafe;border-color:#7fb3f0}
.big2{font-size:1.35rem;font-weight:800;margin:0}
.ja{color:#475569;font-weight:700}
.q2{list-style:none;padding:10px 14px;margin:10px 0;background:#fff8d6;border-radius:14px}
.g{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.g button{margin:0}
.fb{min-height:0;margin-top:6px}.fb:empty{display:none}
body{background-attachment:fixed;min-height:100vh}
.stage{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 16px rgba(0,0,0,.1);text-align:center}
.hud{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px}
.card-now{display:inline-block;min-width:200px;font-size:1.8rem;font-weight:900;padding:14px 22px;border-radius:20px;background:#fff3a3;border:4px solid #f2c14e;box-shadow:0 6px 0 rgba(0,0,0,.12);margin:8px 0}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.bk{font:inherit;font-weight:800;font-size:1.15rem;padding:16px 8px;border-radius:18px;border:3px solid;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.bk small{display:block;font-weight:600;font-size:.85rem;color:#475569}
.bk:active{transform:translateY(3px);box-shadow:none}
.b-p{background:#fff1c9;border-color:#f2c14e}.b-c{background:#d8f3dc;border-color:#74c69d}
.b-t{background:#ffe3d3;border-color:#f4a77a}.b-w{background:#dbeafe;border-color:#7fb3f0}
.opt{display:block;width:100%;font:inherit;font-weight:800;font-size:1.15rem;padding:14px;margin:8px 0;border-radius:16px;border:3px solid #cbd5e1;background:#fff;cursor:pointer}
.msg{min-height:2.2em;font-weight:800;margin:8px 0}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pp .4s}@keyframes pp{50%{transform:scale(1.2)}}
.fly{position:fixed;font-size:2rem;pointer-events:none;animation:fl 1.1s ease-out forwards}
@keyframes fl{to{transform:translate(var(--x),-160px) rotate(var(--r));opacity:0}}
.big{font-size:3.5rem;margin:.1em 0}
.pz{font:inherit;font-weight:800;font-size:.9rem;border:2px solid #94a3b8;background:#fff;border-radius:999px;padding:2px 12px;cursor:pointer;margin-left:6px}
</style>
<script src="accessibility.js"></script>
</head>
<body>
<main>
<a class="btn b3" href="index.html">⬅️ Back to main page</a>
<h1>🎮 Sort &amp; Lead Game</h1>
<div class="stage" id="stage"></div>
<p class="muted" style="margin-top:14px">Stuck? Read the chart first: <a href="hyogo-structure.html">Who is who in Hyogo</a>. Made with Claude AI. Please check the facts.</p>
</main>
<script>
const LV={
 1:{name:'Easy',icon:'⭐',SORT:[['Hyogo','p'],['Kobe','c'],['Nishinomiya','c'],['Ashiya','c'],['Himeji','c'],['Sayo','t'],['Kamigori','t'],["Shin\u2019onsen",'t'],['Higashinada','w'],['Nada','w'],['Suma','w'],['Chuo','w']],
 WHO:[
 ['Who leads Hyogo Prefecture?',['Governor','Mayor','Ward Mayor'],0],
 ['Who leads Kobe City?',['Governor','Mayor','Ward Mayor'],1],
 ['Who leads Ashiya City?',['Mayor','Governor','Ward Mayor'],0],
 ['Who leads Higashinada Ward?',['Mayor','Ward Mayor','Governor'],1],
 ['Which one makes Kobe\u2019s rules and budget with the mayor?',['City Assembly','Prefecture Zoo','Ward Bus'],0]]},
 2:{name:'Normal',icon:'⭐⭐',SORT:[['Akashi','c'],['Itami','c'],['Sanda','c'],['Amagasaki','c'],['Taka','t'],['Inami','t'],['Ichikawa','t'],['Nagata','w'],['Tarumi','w'],['Hyogo','p'],['Takarazuka','c'],['Fukusaki','t']],
 WHO:[
 ['Who leads Sayo Town?',['Town Mayor','Governor','Ward Mayor'],0],
 ['Who leads Nada Ward?',['Mayor','Ward Mayor','Governor'],1],
 ['How do people get to be mayor?',['Citizens vote for them','The teacher picks them','They are chosen by lottery'],0],
 ['How long is a mayor\u2019s term?',['4 years','1 year','10 years'],0],
 ['Which places have wards?',['Only very big cities like Kobe','Every town','Every school'],0],
 ['Do Ashiya and Nishinomiya have wards?',['No','Yes, 9 each','Yes, 3 each'],0]]},
 3:{name:'Challenging',icon:'⭐⭐⭐',SORT:[['Awaji','c'],['Sumoto','c'],['Tamba-Sasayama','c'],['Kami','t'],['Harima','t'],['Taishi','t'],['Kita','w'],['Nishi','w'],['Chuo','w'],['Toyooka','c'],['Kamikawa','t'],['Suma','w'],['Ako','c'],['Inagawa','t']],
 WHO:[
 ['Hyogo has 29 cities and 12 towns. How many cities and towns in all?',['41','39','17'],0],
 ['Which one is NOT a city or a town?',['Higashinada Ward','Himeji','Sayo'],0],
 ['The City Assembly has 65 members. How many votes is a majority (more than half)?',['33','32','30'],0],
 ['A mayor wins in 2025 and serves 4 years. When is the next mayor election?',['2029','2027','2030'],0],
 ['Kobe calls its City Assembly 市会 (shikai). Which city does too?',['Kyoto','Sayo','Higashinada Ward'],0],
 ['Why can the mayor and the City Assembly work as equals?',['Citizens elect both of them','The Governor picks both','They are the same people'],0],
 ['Which is bigger?',['A prefecture holds many cities and towns','A town holds many prefectures','A ward holds a prefecture'],0]]}
};
let SORT=LV[1].SORT,WHO=LV[1].WHO,LEVEL=1;
const HINT={p:'A prefecture is the biggest. It holds many cities and towns.',c:'A city is bigger and busier than a town.',t:'A town is smaller, with more countryside.',w:'A ward is a part inside a very big city, like Kobe.'};
const NAME={p:'Prefecture',c:'City',t:'Town',w:'Ward'};
const st=document.getElementById('stage');
const SK='cld-hyogo-game';
function sv(ph){try{localStorage.setItem(SK,JSON.stringify({ph:ph,l:LEVEL,score:score,streak:streak,best:best,i:i,deck:deck,r2:r2,ok2:ok2}))}catch(e){}}
function ld(){try{return JSON.parse(localStorage.getItem(SK)||'null')}catch(e){return null}}
function clr(){try{localStorage.removeItem(SK)}catch(e){}}
function pause(){st.innerHTML='<div class="big">⏸️</div><h2>Paused and saved!</h2><p>Open this page again in the <b>same browser</b> and tap <b>Continue</b> to keep going.</p><button class="bk b-c" style="width:100%" onclick="menu()">OK</button>';}
function resume(){const d=ld();if(!d)return menu();LEVEL=d.l;SORT=LV[LEVEL].SORT;WHO=LV[LEVEL].WHO;score=d.score;streak=d.streak;best=d.best;i=d.i;deck=d.deck;r2=d.r2;ok2=d.ok2;if(d.ph==='r2')q2();else next();}
let score=0,streak=0,best=0,i=0,deck=[],cur=null,r2=0,ok2=0;
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function burst(n,emojis){for(let k=0;k<n;k++){const e=document.createElement('div');e.className='fly';e.textContent=emojis[k%emojis.length];e.style.left=(30+Math.random()*40)+'vw';e.style.top='55vh';e.style.setProperty('--x',(Math.random()*160-80)+'px');e.style.setProperty('--r',(Math.random()*360)+'deg');document.body.appendChild(e);setTimeout(()=>e.remove(),1200);}}
function start(l){if(l){LEVEL=l;SORT=LV[l].SORT;WHO=LV[l].WHO;}score=0;streak=0;best=0;i=0;deck=shuffle(SORT.slice());next();}
function hud(label){return `<div class="hud"><span>${label}</span><span>⭐ ${score}</span><span>🔥 ${streak}</span><button class="pz" onclick="pause()">⏸️ Pause</button></div>`;}
function next(){
 if(i>=deck.length){return round2Intro();}
 cur=deck[i];sv('r1');
 st.innerHTML=hud(`${LV[LEVEL].icon} Round 1: Sort it! ${i+1}/${deck.length}`)+
 `<p style="margin:0">Where does this place belong?</p><div class="card-now pop" id="cardNow">${cur[0]}</div>
 <div class="msg" id="msg"></div>
 <div class="buckets">
 <button class="bk b-p" onclick="sort('p')">🗾 Prefecture<small>県</small></button>
 <button class="bk b-c" onclick="sort('c')">🏙️ City<small>市</small></button>
 <button class="bk b-t" onclick="sort('t')">🏘️ Town<small>町</small></button>
 <button class="bk b-w" onclick="sort('w')">📍 Ward<small>区</small></button></div>`;
}
function sort(k){
 const m=document.getElementById('msg'),c=document.getElementById('cardNow');
 if(k===cur[1]){streak++;best=Math.max(best,streak);score+=10+(streak>=3?5:0);
  m.style.color='#15803d';m.textContent=`✅ ${cur[0]} is a ${NAME[k]}!`+(streak>=3?' 🔥 Streak bonus!':'');
  burst(streak>=3?8:4,['⭐','✨','🎉']);i++;setTimeout(next,streak>=3?900:700);
  document.querySelectorAll('.bk').forEach(b=>b.disabled=true);
 }else{streak=0;m.style.color='#b45309';m.textContent='❌ Not quite. '+HINT[cur[1]];
  c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  st.querySelector('.hud').children[2].textContent='🔥 0';}
}
function round2Intro(){r2=0;ok2=0;sv('r2');
 st.innerHTML=`<div class="big">🎉</div><h2>Round 1 done!</h2><p>Score: <b>⭐ ${score}</b>. Best streak: <b>🔥 ${best}</b></p><p>Now: who is the leader?</p><button class="bk b-c" style="width:100%" onclick="r2=0;ok2=0;q2()">▶️ Round 2: Who leads?</button>`;
 burst(10,['🎉','⭐','🎊']);
}
function q2(){
 if(r2>=WHO.length)return end();
 const q=WHO[r2];sv('r2');
 const order=shuffle(q[1].map((t,n)=>[t,n===q[2]]));
 st.innerHTML=hud(`Round 2: ${r2+1}/${WHO.length}`)+`<h2 style="margin:.3em 0">${q[0]}</h2><div id="opts"></div><div class="msg" id="msg"></div>`;
 const box=document.getElementById('opts');
 order.forEach(([t,good])=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>{
  const m=document.getElementById('msg');
  if(good){score+=10;ok2++;m.style.color='#15803d';m.textContent='✅ Yes!';burst(5,['⭐','✨']);box.querySelectorAll('button').forEach(x=>x.disabled=true);r2++;setTimeout(q2,800);}
  else{m.style.color='#b45309';m.textContent='❌ Try again!';b.classList.add('shake');b.disabled=true;}
 };box.appendChild(b);});
}
function end(){clr();try{var P=JSON.parse(localStorage.getItem('cld-island')||'{}');P.auto=P.auto||{};P.auto['hg']=Math.max(P.auto['hg']||0,LEVEL);localStorage.setItem('cld-island',JSON.stringify(P))}catch(e){}
 const max=SORT.length*10+WHO.length*10;
 const badge=score>=max*0.9?'🏆 Hyogo Master Detective':score>=max*0.6?'🥈 Super Detective':'🥉 Rookie Detective';
 st.innerHTML=`<div class="big">🏅</div><h2>${badge}</h2><p style="font-size:1.4rem">⭐ ${score} points</p><p>Best streak: 🔥 ${best}</p><button class="bk b-c" style="width:100%" onclick="menu()">🔁 Play again</button>`;
 burst(14,['🎉','⭐','🎊','✨']);
}
function menu(){
 const sd=ld();
 st.innerHTML=(sd?`<button class="bk b-w" style="width:100%;margin-bottom:12px" onclick="resume()">▶️ Continue my game<small>${LV[sd.l].icon} ${LV[sd.l].name}, saved on this device</small></button>`:'')+`<div class="big">🕵️</div><h2>Ready, detective?</h2><p>Sort places into <b>Prefecture, City, Town</b> or <b>Ward</b>. Then find out <b>who leads</b> each place. Get 3 in a row for a 🔥 bonus!</p><p><b>Pick a level:</b></p>
 <button class="bk b-c" style="width:100%;margin-bottom:8px" onclick="start(1)">⭐ Easy<small>Places you know</small></button>
 <button class="bk b-p" style="width:100%;margin-bottom:8px" onclick="start(2)">⭐⭐ Normal<small>More places and more about how leaders are chosen</small></button>
 <button class="bk b-t" style="width:100%" onclick="start(3)">⭐⭐⭐ Challenging<small>Tricky places, math and thinking questions</small></button>`;
}
menu();
</script>
</body>
</html>
